[package]
name = "minipdf-python-native"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PdfLibrarys/minipdf-python"
description = "Native Rust engine bindings for the MiniPdf Python package."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
minipdf = { git = "https://github.com/PdfLibrarys/minipdf-rs.git", rev = "c2ec4ff992ffb2ba7139f6a70dee0888bf90946f" }
pyo3 = { version = "0.25", features = ["abi3-py310"] }

[profile.release]
lto = true
strip = "symbols"
